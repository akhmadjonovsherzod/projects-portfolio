<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nursing English — Вход</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <button id="theme-toggle" class="icon-btn" style="float:right">🌙</button>
    <button id="lang-toggle" class="icon-btn" style="float:right; margin-right:6px;">EN</button>
    <h1>🩺 Nursing English</h1>

    <div id="login-view">
      <h2 data-i18n="loginTitle" style="text-align:center;font-size:1.1rem;">Вход</h2>
      <div id="auth-error" class="error-msg"></div>
      <form id="login-form">
        <label data-i18n="email" for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email" />
        <label data-i18n="password" for="login-password">Пароль</label>
        <input id="login-password" type="password" required autocomplete="current-password" />
        <button type="submit" data-i18n="loginBtn" style="width:100%;">Войти</button>
      </form>
      <p class="switch"><a href="#" id="show-register" data-i18n="noAccount">Нет аккаунта? Зарегистрироваться</a></p>
    </div>

    <div id="register-view" style="display:none;">
      <h2 data-i18n="registerTitle" style="text-align:center;font-size:1.1rem;">Регистрация</h2>
      <div id="auth-error-2" class="error-msg"></div>
      <form id="register-form">
        <label data-i18n="name" for="register-name">Имя</label>
        <input id="register-name" type="text" autocomplete="name" />
        <label data-i18n="email" for="register-email">Email</label>
        <input id="register-email" type="email" required autocomplete="email" />
        <label data-i18n="password" for="register-password">Пароль</label>
        <input id="register-password" type="password" required minlength="6" autocomplete="new-password" />
        <button type="submit" data-i18n="registerBtn" style="width:100%;">Зарегистрироваться</button>
      </form>
      <p class="switch"><a href="#" id="show-login" data-i18n="haveAccount">Уже есть аккаунт? Войти</a></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("show-register").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("login-view").style.display = "none";
    document.getElementById("register-view").style.display = "block";
  });
  document.getElementById("show-login").addEventListener("click", (e) => {
    e.preventDefault();
    document.getElementById("register-view").style.display = "none";
    document.getElementById("login-view").style.display = "block";
  });
  // If already logged in, skip straight to the app.
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof auth !== "undefined") {
      auth.onAuthStateChanged((user) => { if (user) window.location.href = "app.html"; });
    }
  });
</script>
</body>
</html>
