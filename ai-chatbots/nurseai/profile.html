<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nursing English — Профиль</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="bar">
    <div class="brand">🩺 <span data-i18n="appName">Nursing English</span></div>
    <div class="nav-links">
      <a href="app.html" data-i18n="navLearn">Обучение</a>
      <a href="profile.html" class="active" data-i18n="navProfile">Профиль</a>
      <button id="lang-toggle" class="icon-btn">EN</button>
      <button id="theme-toggle" class="icon-btn">🌙</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="card profile-card">
    <img id="profile-photo" class="profile-photo" src="" alt="" style="display:none;" />
    <div id="profile-photo-placeholder" class="profile-photo" style="display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 14px;">👤</div>
    <div class="profile-field">
      <div class="label" data-i18n="name">Имя</div>
      <div id="profile-name">—</div>
    </div>
    <div class="profile-field">
      <div class="label" data-i18n="email">Email</div>
      <div id="profile-email">—</div>
    </div>
    <button id="logout-btn" data-i18n="logout" class="btn-secondary" style="margin-top:10px;width:100%;">Выйти</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    requireAuth((user) => {
      document.getElementById("profile-name").textContent = user.displayName || "—";
      document.getElementById("profile-email").textContent = user.email || "—";
      if (user.photoURL) {
        const img = document.getElementById("profile-photo");
        img.src = user.photoURL;
        img.style.display = "block";
        document.getElementById("profile-photo-placeholder").style.display = "none";
      }
    });
    document.getElementById("logout-btn").addEventListener("click", logout);
  });
</script>
</body>
</html>
