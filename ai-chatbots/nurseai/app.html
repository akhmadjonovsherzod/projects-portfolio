<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nursing English — Обучение</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="app-header">
  <div class="bar">
    <div class="brand">🩺 <span data-i18n="appName">Nursing English</span></div>
    <div class="nav-links">
      <a href="app.html" class="active" data-i18n="navLearn">Обучение</a>
      <a href="profile.html" data-i18n="navProfile">Профиль</a>
      <button id="lang-toggle" class="icon-btn">EN</button>
      <button id="theme-toggle" class="icon-btn">🌙</button>
    </div>
  </div>
</header>

<div class="container app-layout">
  <nav class="units-nav card">
    <h2>Units</h2>
    <ul id="units-list"></ul>
  </nav>

  <main class="main-panel">
    <div class="card">
      <div class="unit-header">
        <div>
          <h1 id="unit-title">—</h1>
          <p class="subtitle" id="unit-intro"></p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="vocab" data-i18n="vocabTab">Словарь</button>
        <button class="tab-btn" data-tab="content">Язык и практика</button>
        <button class="tab-btn" data-tab="exercises" data-i18n="exercisesTab">Упражнения</button>
        <button class="tab-btn" data-tab="reading">Reading Bank</button>
      </div>

      <section id="tab-vocab" class="tab-content">
        <div class="vocab-tools"><label for="vocab-search">Поиск слов</label><input id="vocab-search" type="search" placeholder="Английское или русское слово"><label for="vocab-pos">Часть речи</label><select id="vocab-pos"><option value="">Все</option><option>n</option><option>v</option><option>adj</option><option>adv</option><option>phrase</option></select></div>
        <div class="vocab-grid" id="vocab-grid"></div>
      </section>

      <section id="tab-content" class="tab-content" style="display:none;"><div id="unit-content-root"></div></section>

      <section id="tab-exercises" class="tab-content" style="display:none;">
        <div id="exercises-root"></div>
      </section>

      <section id="tab-reading" class="tab-content" style="display:none;"><div id="reading-root"></div></section>
    </div>
  </main>

  <aside class="chat-panel card">
    <h2>🤖 AI Tutor</h2>
    <button id="summarize-btn" data-i18n="summarize">Резюме юнита</button>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" data-i18n-placeholder="chatPlaceholder" placeholder="Спросите про слово или грамматику..." autocomplete="off" />
      <button type="submit" data-i18n="send">Отправить</button>
    </form>
  </aside>
</div>

<footer class="app-footer">Nursing English learning site — Oxford English for Careers: Nursing 1</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<script src="js/units-data.js"></script>
<script src="js/learning-data.js"></script>
<script src="js/exercises.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
