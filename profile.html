<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Latin Clinical Terms — Profile</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="topnav">
    <div class="brand"><span class="cross">✚</span><span data-i18n="app_name">Latin Clinical Terms</span></div>
    <nav class="nav-links">
      <a href="chatbot.html" data-i18n="nav_chat">Tutor</a>
      <a href="profile.html" class="active" data-i18n="nav_profile">Profile</a>
    </nav>
    <div class="nav-right">
      <div class="lang-switch">
        <button data-lang="en">EN</button>
        <button data-lang="uz">UZ</button>
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <div class="profile-wrap">
    <div class="profile-card">
      <img id="profile-avatar" class="profile-avatar hidden" alt="Profile photo" />
      <h1 data-i18n="profile_title">Profile</h1>

      <div class="profile-field">
        <div class="label" data-i18n="profile_name">Name</div>
        <div class="value" id="profile-name">—</div>
      </div>
      <div class="profile-field">
        <div class="label" data-i18n="profile_email">Email</div>
        <div class="value" id="profile-email">—</div>
      </div>

      <button class="btn btn-ghost" id="logout-btn" data-i18n="logout">Log out</button>
    </div>
  </div>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
