<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LatinaMed AI — Latin in Medicine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f4fa; --surface:#fff; --surface-2:#f8faff; --surface-off:#eef2fb;
  --div:#dde4f2; --border:#c8d3e8;
  --text:#0d1b3e; --muted:#5a6a8e; --faint:#a0aec5;
  --primary:#2563eb; --ph:#1d4ed8; --plight:#dbeafe;
  --success:#16a34a; --error:#dc2626; --err-bg:#fef2f2;
  --sh-sm:0 1px 3px rgb(37 99 235/.08);
  --sh:0 4px 16px rgb(37 99 235/.1);
  --sh-lg:0 16px 48px rgb(37 99 235/.15);
  --ff:'Instrument Serif',Georgia,serif;
  --fb:'Inter',system-ui,sans-serif;
  --xs:.75rem; --sm:.875rem; --base:1rem; --lg:1.25rem; --xl:1.75rem;
  --ease:160ms cubic-bezier(.16,1,.3,1);
  --r:.5rem; --rl:.75rem; --rx:1rem; --r2:1.5rem; --rf:9999px;
}
[data-theme=dark]{
  --bg:#090d18; --surface:#0f1623; --surface-2:#131c2e; --surface-off:#18223a;
  --div:#1c2845; --border:#243258; --text:#dde4f8; --muted:#7b8fb5; --faint:#4a5a7a;
  --primary:#3b82f6; --ph:#2563eb; --plight:#1e3a6e;
  --err-bg:#2d1515;
  --sh-sm:0 1px 3px rgb(0 0 0/.35);
  --sh:0 4px 16px rgb(0 0 0/.45);
  --sh-lg:0 16px 48px rgb(0 0 0/.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--fb);font-size:var(--base);color:var(--text);background:var(--bg)}
img,svg{display:block;max-width:100%}
input,button,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{font-family:var(--ff);line-height:1.15}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:3px}

.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1.125rem;border-radius:var(--r);font-size:var(--sm);font-weight:500;transition:background var(--ease),border-color var(--ease);cursor:pointer;border:1px solid transparent}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-p:hover{background:var(--ph);border-color:var(--ph)}
.btn-p:disabled{opacity:.5;cursor:not-allowed}
.btn-g{background:transparent;color:var(--muted);border-color:var(--border)}
.btn-g:hover{background:var(--surface-off);color:var(--text)}
.btn-full{width:100%;justify-content:center}
.ib{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--muted);border:1px solid transparent;transition:all var(--ease);cursor:pointer;background:none}
.ib:hover{background:var(--surface-off);border-color:var(--border);color:var(--text)}

.field{display:flex;flex-direction:column;gap:.375rem}
.field label{font-size:var(--sm);font-weight:500}
.inp{width:100%;padding:.625rem .875rem;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);font-size:var(--sm);color:var(--text);outline:none;transition:border-color var(--ease),box-shadow var(--ease)}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp::placeholder{color:var(--faint)}

.alert{padding:.75rem 1rem;border-radius:var(--r);font-size:var(--sm);display:none}
.alert.show{display:flex;align-items:flex-start;gap:.5rem}
.alert-err{background:var(--err-bg);color:var(--error);border:1px solid color-mix(in srgb,var(--error) 25%,transparent)}

/* AUTH */
#authView{display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:1.5rem;background:linear-gradient(135deg,#1e40af 0%,#1d4ed8 40%,#2563eb 70%,#3b82f6 100%)}
.acard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh-lg);width:100%;max-width:420px}
.atop{padding:2rem 2rem 1.5rem;text-align:center;border-bottom:1px solid var(--div)}
.alogo{width:56px;height:56px;margin:0 auto 1rem;border-radius:var(--rx);background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 40%,transparent)}
.atop h1{font-size:var(--xl);margin-bottom:.25rem}
.atop p{font-size:var(--sm);color:var(--muted)}
.atabs{display:flex;border-bottom:1px solid var(--div)}
.atab{flex:1;padding:.875rem;font-size:var(--sm);font-weight:500;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all var(--ease)}
.atab.active{color:var(--primary);border-bottom-color:var(--primary)}
.abody{padding:1.75rem 2rem 2rem;display:flex;flex-direction:column;gap:1.125rem}
.afooter{text-align:center;font-size:var(--xs);color:var(--muted);padding-top:.25rem}
.afooter a{text-decoration:none}
.pws{height:3px;border-radius:var(--rf);background:var(--div);margin-top:.375rem;overflow:hidden}
.pwb{height:100%;width:0;border-radius:var(--rf);transition:width .3s,background .3s}
.asec{padding:.875rem 2rem 1.25rem;text-align:center;font-size:var(--xs);color:var(--faint)}

/* APP — true full viewport */
#appView{display:none;grid-template-rows:auto 1fr auto;width:100vw;height:100dvh;overflow:hidden}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:.875rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--sh-sm);gap:1rem;z-index:10}
.hbrand{display:flex;align-items:center;gap:.75rem}
.hlogo{width:38px;height:38px;border-radius:var(--rl);background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 35%,transparent)}
.hname{font-size:var(--lg);font-family:var(--ff)}
.hsub{display:flex;align-items:center;gap:.5rem;margin-top:1px}
.bon{display:inline-flex;align-items:center;gap:4px;font-size:var(--xs);color:var(--success);background:color-mix(in srgb,var(--success) 10%,var(--surface));padding:2px 8px;border-radius:var(--rf)}
.bon::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hqc{font-size:var(--xs);color:var(--faint)}
.hact{display:flex;align-items:center;gap:.5rem;flex-shrink:0}

.pavatar{width:36px;height:36px;border-radius:var(--rf);background:var(--primary);color:#fff;font-size:var(--sm);font-weight:700;border:2px solid color-mix(in srgb,var(--primary) 40%,var(--border));display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--ease)}
.pavatar:hover{background:var(--ph);box-shadow:0 0 0 3px var(--plight)}
.pwrap{position:relative}
.pdrop{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--sh-lg);min-width:190px;z-index:50;padding:.5rem;display:none;animation:dropIn .18s cubic-bezier(.16,1,.3,1)}
.pdrop.open{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ddhdr{padding:.5rem .75rem .625rem;border-bottom:1px solid var(--div);margin-bottom:.25rem}
.ddn{font-size:var(--sm);font-weight:600}
.dde{font-size:var(--xs);color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.ddi{display:flex;align-items:center;gap:.625rem;width:100%;padding:.5rem .75rem;border-radius:var(--r);font-size:var(--sm);color:var(--muted);cursor:pointer;transition:all var(--ease);background:none;border:none;text-align:left}
.ddi:hover{background:var(--surface-off);color:var(--text)}
.ddi.danger{color:var(--error)}
.ddi.danger:hover{background:var(--err-bg)}

.chat{overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;background:var(--bg)}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--rf)}

.msg{display:flex;gap:.75rem;max-width:min(84%,820px);animation:fadeUp .22s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mai{align-self:flex-start}
.muser{align-self:flex-end;flex-direction:row-reverse}
.mav{width:34px;height:34px;border-radius:var(--rf);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--sm)}
.mai .mav{background:var(--plight);color:var(--primary);border:1px solid color-mix(in srgb,var(--primary) 30%,var(--border))}
.muser .mav{background:var(--primary);color:#fff}
.mbub{padding:.875rem 1rem;border-radius:var(--rl);font-size:var(--sm);line-height:1.7}
.mai .mbub{background:var(--surface);border:1px solid var(--border);border-radius:4px var(--rl) var(--rl) var(--rl);box-shadow:var(--sh-sm)}
.muser .mbub{background:var(--primary);color:#fff;border-radius:var(--rl) 4px var(--rl) var(--rl)}
.mlbl{font-size:var(--xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.mai .mlbl{color:var(--primary)}
.mbub p+p{margin-top:.625rem}
.mbub ul{padding-left:1.25rem;margin-top:.5rem}
.mbub li{margin-bottom:.25rem}
.mbub em{font-style:italic;font-family:var(--ff)}

.typing{display:flex;gap:5px;align-items:center;padding:.75rem 1rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bounce 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:min(5vw,4rem) 1.5rem;gap:1rem}
.wicon{width:68px;height:68px;border-radius:var(--r2);background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.welcome h2{font-size:clamp(1.25rem,3vw,1.75rem)}
.welcome p{font-size:var(--sm);color:var(--muted);max-width:48ch}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.5rem}
.chip{padding:.375rem .875rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--rf);font-size:var(--xs);color:var(--muted);cursor:pointer;transition:all var(--ease)}
.chip:hover{background:var(--plight);border-color:var(--primary);color:var(--primary)}

.ibar{padding:1rem 1.5rem;background:var(--surface);border-top:1px solid var(--border)}
.iform{display:flex;gap:.75rem;align-items:flex-end}
.iwrap{flex:1;display:flex;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--rl);overflow:hidden;transition:border-color var(--ease),box-shadow var(--ease)}
.iwrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.minp{flex:1;padding:.75rem 1rem;background:none;border:none;outline:none;font-size:var(--sm);color:var(--text);resize:none;min-height:44px;max-height:120px;line-height:1.5}
.minp::placeholder{color:var(--faint)}
.sbtn{width:44px;min-height:44px;flex-shrink:0;background:var(--primary);color:#fff;border:none;border-radius:0 calc(var(--rl) - 2px) calc(var(--rl) - 2px) 0;display:flex;align-items:center;justify-content:center;transition:background var(--ease);cursor:pointer}
.sbtn:hover{background:var(--ph)}
.hint{font-size:var(--xs);color:var(--faint);text-align:center;margin-top:.5rem}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
.backdrop.open{display:flex;animation:fi .2s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:85dvh;overflow-y:auto;animation:su .22s cubic-bezier(.16,1,.3,1)}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.mhdr{padding:1.5rem 1.75rem;border-bottom:1px solid var(--div);display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.mhdr h2{font-size:var(--xl)}
.mhdr p{font-size:var(--sm);color:var(--muted);margin-top:2px}
.mbody{padding:1.5rem 1.75rem;display:flex;flex-direction:column;gap:1.25rem}
.ss h3{font-size:var(--xs);text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--primary);margin-bottom:.625rem;font-family:var(--fb)}
.ss ul{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.ss li{padding:.625rem .875rem;background:var(--surface-off);border-radius:var(--r);font-size:var(--sm);line-height:1.6;border-left:3px solid var(--plight)}
.mftr{padding:1rem 1.75rem;border-top:1px solid var(--div);display:flex;gap:.75rem;justify-content:flex-end}

@media(max-width:640px){
  .hdr{padding:.75rem 1rem}.chat{padding:1rem}.ibar{padding:.75rem 1rem}
  .hqc,.endlbl{display:none}
  .abody{padding:1.25rem}.atop{padding:1.5rem 1.25rem 1.25rem}
}
@media(min-width:1400px){
  .chat{padding:2rem calc((100% - 900px)/2)}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authView">
  <div class="acard">
    <div class="atop">
      <div class="alogo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="11" y="4" width="6" height="20" rx="2.5" fill="white" opacity=".95"/>
          <rect x="4" y="11" width="20" height="6" rx="2.5" fill="white" opacity=".95"/>
          <circle cx="14" cy="14" r="3" fill="white" opacity=".45"/>
        </svg>
      </div>
      <h1>LatinaMed AI</h1>
      <p>Latin in Medicine — Educational Assistant</p>
    </div>
    <div class="atabs">
      <button class="atab active" id="tabLogin"  onclick="switchTab('login')">Log In</button>
      <button class="atab"        id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="abody" onsubmit="doLogin(event)" novalidate>
      <div id="loginAlert" class="alert alert-err">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginAlertMsg"></span>
      </div>
      <div class="field">
        <label for="liEmail">Email or Username</label>
        <input class="inp" type="text" id="liEmail" placeholder="you@example.com or username" autocomplete="username">
      </div>
      <div class="field">
        <label for="liPw">Password</label>
        <input class="inp" type="password" id="liPw" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-p btn-full" id="loginBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Log In
      </button>
      <p class="afooter">No account? <a href="#" onclick="switchTab('signup');return false">Sign up free</a></p>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="abody" onsubmit="doSignup(event)" novalidate style="display:none">
      <div id="signupAlert" class="alert alert-err">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="signupAlertMsg"></span>
      </div>
      <div class="field">
        <label for="suUser">Username</label>
        <input class="inp" type="text" id="suUser" placeholder="e.g. dr_anatomicus" autocomplete="username">
      </div>
      <div class="field">
        <label for="suEmail">Email Address</label>
        <input class="inp" type="email" id="suEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="suPw">Password</label>
        <input class="inp" type="password" id="suPw" placeholder="Min. 8 characters" autocomplete="new-password" oninput="pwStrength(this.value)">
        <div class="pws"><div class="pwb" id="pwBar"></div></div>
      </div>
      <div class="field">
        <label for="suPw2">Confirm Password</label>
        <input class="inp" type="password" id="suPw2" placeholder="Repeat password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-p btn-full" id="signupBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        Create Account
      </button>
      <p class="afooter">Have an account? <a href="#" onclick="switchTab('login');return false">Log in</a></p>
    </form>

    <div class="asec">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:-2px;margin-right:3px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Secured by Firebase Authentication
    </div>
  </div>
</div>

<!-- APP -->
<div id="appView">
  <header class="hdr">
    <div class="hbrand">
      <div class="hlogo">
        <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
          <rect x="11" y="4" width="6" height="20" rx="2.5" fill="white" opacity=".95"/>
          <rect x="4" y="11" width="20" height="6" rx="2.5" fill="white" opacity=".95"/>
          <circle cx="14" cy="14" r="3" fill="white" opacity=".45"/>
        </svg>
      </div>
      <div>
        <div class="hname">LatinaMed AI</div>
        <div class="hsub">
          <span class="bon">Online</span>
          <span class="hqc" id="qCount">0 questions</span>
        </div>
      </div>
    </div>
    <div class="hact">
      <button class="btn btn-p" id="endBtn" onclick="endSession()" style="font-size:.8rem">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="endlbl">End &amp; Get Summary</span>
      </button>
      <button class="ib" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme"></button>
      <div class="pwrap" id="pwrap">
        <div class="pavatar" id="pavatar" onclick="toggleDrop()" tabindex="0" role="button" aria-label="Profile menu">?</div>
        <div class="pdrop" id="pdrop">
          <div class="ddhdr">
            <div class="ddn" id="ddName">—</div>
            <div class="dde" id="ddEmail">—</div>
          </div>
          <button class="ddi danger" onclick="doLogout()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="chat" id="chatArea"></div>

  <div class="ibar">
    <form class="iform" id="chatForm" onsubmit="onSend(event)">
      <div class="iwrap">
        <textarea class="minp" id="msgInput" placeholder="Ask about medical Latin…" rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();document.getElementById('chatForm').dispatchEvent(new Event('submit',{cancelable:true}))}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button type="submit" class="sbtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </form>
    <p class="hint">Powered by Google Gemini &nbsp;•&nbsp; Educational purposes only</p>
  </div>
</div>

<!-- SUMMARY MODAL -->
<div class="backdrop" id="backdrop" onclick="if(event.target===this)closeMod()">
  <div class="modal">
    <div class="mhdr">
      <div><h2>Session Summary</h2><p id="sumSub">Key learning points</p></div>
      <button class="ib" onclick="closeMod()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

}
function toggleTheme() { _dark = !_dark; applyTheme(); }
applyTheme();
</script>
